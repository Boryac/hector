version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/researchos/db/migrations"
    queries: "internal/researchos/db/queries"
    gen:
      go:
        package: "db"
        out: "internal/researchos/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: false
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
