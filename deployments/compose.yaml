# Hector ResearchOS — Docker Compose 模板（Codex 按实际服务名与端口补齐，不得直接照抄未验证）
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hector
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: hector
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hector"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    profiles: ["optional"]
  api:
    build: {context: .., dockerfile: Dockerfile}
    command: ["./api"]
    environment:
      DATABASE_URL: postgres://hector:${POSTGRES_PASSWORD:-changeme}@postgres:5432/hector?sslmode=disable
    ports: ["8080:8080"]
    depends_on: {postgres: {condition: service_healthy}}
  worker:
    build: {context: .., dockerfile: Dockerfile}
    command: ["./worker"]
    environment:
      DATABASE_URL: postgres://hector:${POSTGRES_PASSWORD:-changeme}@postgres:5432/hector?sslmode=disable
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    depends_on: {postgres: {condition: service_healthy}}
  web:
    build: {context: ../web, dockerfile: Dockerfile}
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    depends_on: [api]
volumes:
  postgres_data:
